<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TaskFlow">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">
        <header class="topbar">
            <div class="brand"><span class="brand-mark">✓</span><span>todo.</span></div>
            <div class="top-actions">
                <button id="themeBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">☼</button>
                <button id="clearBtn" class="text-btn">Clear completed</button>
            </div>
        </header>

        <section class="welcome">
            <p id="dateLabel" class="date-label"></p>
            <h1>Good afternoon <span aria-hidden="true">👋</span></h1>
            <p id="welcomeMessage">Today is a new opportunity to be productive!</p>
        </section>

        <section class="toolbar" aria-label="Task controls">
            <div class="search-wrap"><span aria-hidden="true">⌕</span><input type="search" id="searchInput" placeholder="Search tasks..." aria-label="Search tasks"></div>
            <div class="filters" role="group" aria-label="Filter tasks">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>
        </section>

        <section class="task-section">
            <div class="section-title"><h2>My tasks <span id="taskCount">0</span></h2><button id="addBtn" class="add-btn">＋</button></div>
            <ul id="taskList"></ul>
            <div id="emptyMessage" class="empty-message"><div class="empty-icon">✦</div><h3>You don't have any tasks yet</h3><p>Click on the + button to add one</p></div>
        </section>
    </main>

    <dialog id="taskDialog">
        <form id="taskForm" method="dialog">
            <div class="dialog-heading"><h2 id="dialogTitle">Add task</h2><button type="button" id="closeDialog" class="close-btn" aria-label="Close">×</button></div>
            <label>Task<input id="taskInput" required maxlength="120" placeholder="What needs to be done?"></label>
            <label>Notes<textarea id="notesInput" rows="3" placeholder="Add a note (optional)"></textarea></label>
            <div class="form-grid"><label>Due date<input id="dueDateInput" type="date"></label><label>Priority<select id="priorityInput"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label></div>
            <label>Category<select id="categoryInput"><option>Personal</option><option>Work</option><option>Study</option><option>Shopping</option></select></label>
            <button class="save-btn" type="submit">Save task</button>
        </form>
    </dialog>


    <script src="script.js"></script>

</body>
</html>
